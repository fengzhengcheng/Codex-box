<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户编辑 - 晴雨通天气管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f5f5f5; }
        .header { background: #667eea; color: white; padding: 15px 30px; }
        .header h1 { margin: 0; font-size: 24px; }
        .container { max-width: 600px; margin: 30px auto; padding: 30px; background: white; border-radius: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { padding: 12px 30px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #5568d3; }
        .btn-group { display: flex; gap: 10px; }
        .back { margin-top: 20px; }
        .back a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${action == 'add' ? '新增用户' : '编辑用户'}">用户编辑</h1>
    </div>
    <div class="container">
        <form th:action="@{/admin/user/{action}(action=${action})}" method="post">
            <input type="hidden" name="id" th:value="${user.id}">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" th:value="${user.username}" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" th:value="${user.password}" required>
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" name="phone" th:value="${user.phone}" required>
            </div>
            <div class="form-group">
                <label>角色</label>
                <select name="role" th:value="${user.role}">
                    <option value="user" th:selected="${user.role == 'user'}">普通用户</option>
                    <option value="admin" th:selected="${user.role == 'admin'}">管理员</option>
                </select>
            </div>
            <div class="btn-group">
                <button type="submit">保存</button>
                <button type="button" onclick="history.back()">取消</button>
            </div>
        </form>
        <div class="back">
            <a th:href="@{/admin/user/list}">返回用户列表</a>
        </div>
    </div>
</body>
</html>
