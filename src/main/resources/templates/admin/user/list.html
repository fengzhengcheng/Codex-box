<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户列表 - 晴雨通天气管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f5f5f5; }
        .header { background: #667eea; color: white; padding: 15px 30px; display: flex; justify-content: space-between; }
        .header h1 { margin: 0; font-size: 24px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .msg { padding: 10px; background: #d4edda; color: #155724; border-radius: 5px; margin-bottom: 20px; }
        .toolbar { margin-bottom: 20px; }
        .toolbar a { padding: 10px 20px; background: #667eea; color: white; text-decoration: none; border-radius: 5px; }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #667eea; color: white; }
        tr:hover { background: #f5f5f5; }
        .actions a { margin-right: 10px; color: #667eea; text-decoration: none; }
        .actions .delete { color: #dc3545; }
        .back { margin-top: 20px; }
        .back a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>用户管理</h1>
        <a th:href="@{/logout}" style="color: white; text-decoration: none;">退出登录</a>
    </div>
    <div class="container">
        <div th:if="${msg}" class="msg" th:text="${msg}">提示信息</div>
        <div class="toolbar">
            <a th:href="@{/admin/user/add}">新增用户</a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>手机号</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">ID</td>
                    <td th:text="${user.username}">用户名</td>
                    <td th:text="${user.phone}">手机号</td>
                    <td th:text="${user.role}">角色</td>
                    <td th:text="${user.status}">状态</td>
                    <td th:text="${user.createTime}">创建时间</td>
                    <td class="actions">
                        <a th:href="@{/admin/user/edit/{id}(id=${user.id})}">编辑</a>
                        <a th:if="${user.status == '正常'}" th:href="@{/admin/user/disable/{id}(id=${user.id})}">禁用</a>
                        <a th:if="${user.status == '禁用'}" th:href="@{/admin/user/enable/{id}(id=${user.id})}">启用</a>
                        <a class="delete" th:href="@{/admin/user/delete/{id}(id=${user.id})}" onclick="return confirm('确定删除?')">删除</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="back">
            <a th:href="@{/admin/index}">返回后台首页</a>
        </div>
    </div>
</body>
</html>
