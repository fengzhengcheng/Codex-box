<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志 - 晴雨通天气管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f5f5f5; }
        .header { background: #667eea; color: white; padding: 15px 30px; display: flex; justify-content: space-between; }
        .header h1 { margin: 0; font-size: 24px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .logout { color: white; text-decoration: none; }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #667eea; color: white; }
        tr:hover { background: #f5f5f5; }
        .back { margin-top: 20px; }
        .back a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>操作日志</h1>
        <a th:href="@{/logout}" class="logout">退出登录</a>
    </div>
    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>操作内容</th>
                    <th>操作IP</th>
                    <th>操作时间</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.id}">ID</td>
                    <td th:text="${log.operationContent}">操作内容</td>
                    <td th:text="${log.operationIp}">操作IP</td>
                    <td th:text="${log.operationTime}">操作时间</td>
                </tr>
            </tbody>
        </table>
        <div class="back">
            <a th:href="@{/user/index}">返回用户首页</a>
        </div>
    </div>
</body>
</html>
